name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=sluice --cov-report=term
      - run: uv run sluice run examples/inbox-assistant --no-open
      - run: uv run sluice run examples/inbox-assistant --mode strict --no-open --no-vanilla
      - name: Benchmark smoke test (oracle agent, no API keys)
        run: uv run sluice bench --suites banking,slack --limit 2 --out bench-smoke
