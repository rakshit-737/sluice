name: sdk-typescript
on:
  push:
    paths: ["sdk/typescript/**", ".github/workflows/sdk-typescript.yml"]
  pull_request:
    paths: ["sdk/typescript/**", ".github/workflows/sdk-typescript.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: sdk/typescript
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
