name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, catches newly published CVEs
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: Audit dependencies for known vulnerabilities
        run: uv run --with pip-audit pip-audit --skip-editable
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trifecta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Fail on unguarded exfiltration paths in the examples
        run: uv run sluice trifecta examples/inbox-assistant --strict --sarif trifecta.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trifecta-sarif
          path: trifecta.sarif
      - name: Upload to code scanning (needs GitHub Advanced Security on private repos)
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trifecta.sarif
          category: sluice-trifecta
