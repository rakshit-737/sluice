[project]
name = "sluice"
version = "0.1.0"
description = "Information-flow control runtime for LLM agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "typer>=0.27.3",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.13.0"]
openai = ["openai>=3.29.0"]
ollama = ["ollama>=0.6.3"]
mcp = ["mcp>=2.3.0"]
otel = [
    "opentelemetry-api>=1.45.1",
]
bench = [
    "agentdojo>=0.1.35",
]

[project.scripts]
sluice = "sluice.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.169.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "types-pyyaml",
    "opentelemetry-sdk>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sluice"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF001"]
"sluice/cli.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["sluice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sluice"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[[tool.mypy.overrides]]
module = ["agentdojo.*"]
ignore_missing_imports = true
